# Dev setup: `docker compose up --build`
#   Frontend: http://localhost:5173
#   API:      http://localhost:8001      Docs: http://localhost:8001/docs
#   Grafana:  http://localhost:3000 (System Status dashboard)   Prometheus: http://localhost:9090
# The simulator runs separately (simulator/docker-compose.yml) on :8000.
# Source folders are mounted and both servers hot-reload, so edits apply live.
# The database is the local `db` Postgres container (data kept in the `pgdata` volume).
# File storage is still Supabase Storage (configured in backend/.env).
# Override the DB credentials/port with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB /
# POSTGRES_PORT in a root .env file if needed.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel}
      POSTGRES_DB: ${POSTGRES_DB:-fuel}
    ports:
      # exposed so a backend run outside Docker (uvicorn on the host) can use it too
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # the simulator publishes :8000 on the host
      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL:-http://host.docker.internal:8000}
      # local Postgres container (overrides DATABASE_URL from backend/.env)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fuel}:${POSTGRES_PASSWORD:-fuel}@db:5432/${POSTGRES_DB:-fuel}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      # lets the container reach services on your machine (e.g. a local OmniRoute)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Monitoring: Prometheus scrapes the backend's /api/v1/metrics; Grafana shows the "System Status" dashboard.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-status.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
