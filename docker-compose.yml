# Dev setup: `docker compose up --build`
#   Frontend: http://localhost:5173
#   API:      http://localhost:8001      Docs: http://localhost:8001/docs
# The simulator runs separately (simulator/docker-compose.yml) on :8000.
# Source folders are mounted and both servers hot-reload, so edits apply live.
# The database and file storage are Supabase (configured in backend/.env), so
# there is no local database container.

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # the simulator publishes :8000 on the host
      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL:-http://host.docker.internal:8000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      # lets the container reach services on your machine (e.g. a local OmniRoute)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
